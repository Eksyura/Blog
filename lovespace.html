<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#12151b">
<meta name="robots" content="noindex, nofollow">
<title>F</title>
<style>
    @font-face {
        font-family: 'Cascadia Code';
        font-style: normal;
        font-display: swap;
        font-weight: 200 700;
        src: url('./fonts/cascadia-code-latin-wght-normal.woff2') format('woff2-variations');
        unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
    }
    @font-face {
        font-family: 'Cascadia Code';
        font-style: normal;
        font-display: swap;
        font-weight: 200 700;
        src: url('./fonts/cascadia-code-latin-ext-wght-normal.woff2') format('woff2-variations');
        unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
        font-family: 'Cascadia Code', ui-monospace, SFMono-Regular, Menlo, Consolas, 'SimSun', 'Songti SC', 'PingFang SC', 'Microsoft YaHei', monospace;
        --app-vh: 100vh;
        min-height: var(--app-vh);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 18px;
        background: #12151b;
        overflow: hidden;
        color: #e8ecf1;
        -webkit-tap-highlight-color: transparent;
    }

    @supports (min-height: 100svh) {
        body { --app-vh: 100svh; }
    }

    .bg-still {
        position: fixed;
        inset: 0;
        z-index: -3;
        pointer-events: none;
        background-image: url('./backgroundgirl.png');
        background-size: cover;
        background-position: center 22%;
        background-repeat: no-repeat;
        filter: blur(3px) brightness(0.85) saturate(1.02);
        transform: scale(1.03);
    }

    .bg-overlay {
        position: fixed;
        inset: 0;
        z-index: -2;
        pointer-events: none;
        background:
            radial-gradient(120% 90% at 50% 0%, rgba(120, 90, 180, 0.18) 0%, rgba(0, 0, 0, 0) 60%),
            linear-gradient(160deg, rgba(18, 21, 27, 0.46) 0%, rgba(12, 14, 19, 0.74) 100%);
    }

    /* ================= 口令层 ================= */
    .gate {
        width: 100%;
        max-width: 380px;
        padding: 30px 26px 26px;
        border-radius: 24px;
        background: rgba(16, 19, 25, 0.82);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55), 0 1px 0 rgba(255, 255, 255, 0.06) inset;
        backdrop-filter: blur(18px) saturate(115%);
        -webkit-backdrop-filter: blur(18px) saturate(115%);
        animation: fadeUp 0.5s ease both;
    }

    .gate[hidden] { display: none; }

    .gate-avatar {
        width: 54px;
        height: 54px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.4rem;
        font-weight: 600;
        color: #fff;
        letter-spacing: 0.02em;
        background: linear-gradient(140deg, #ff9ec4 0%, #b98cff 55%, #6f8dff 100%);
        box-shadow: 0 8px 24px rgba(180, 120, 255, 0.35);
        margin-bottom: 16px;
    }

    .gate h1 {
        font-size: 1.16rem;
        font-weight: 600;
        letter-spacing: 0.01em;
        margin-bottom: 6px;
    }

    .gate p.hint {
        font-size: 0.78rem;
        line-height: 1.6;
        color: #8d99a9;
        margin-bottom: 18px;
    }

    .field {
        width: 100%;
        display: block;
        padding: 12px 14px;
        border-radius: 14px;
        font-family: inherit;
        font-size: 0.92rem;
        color: #eef2f7;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.14);
        outline: none;
        transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .field::placeholder { color: #6f7b8b; }

    .field:focus {
        border-color: rgba(185, 140, 255, 0.6);
        box-shadow: 0 0 0 3px rgba(185, 140, 255, 0.14);
        background: rgba(255, 255, 255, 0.09);
    }

    .gate-btn {
        width: 100%;
        margin-top: 14px;
        padding: 12px 16px;
        border: none;
        border-radius: 14px;
        font-family: inherit;
        font-size: 0.92rem;
        font-weight: 600;
        color: #fff;
        cursor: pointer;
        background: linear-gradient(135deg, #b98cff 0%, #6f8dff 100%);
        box-shadow: 0 8px 22px rgba(120, 110, 255, 0.32);
        transition: transform 0.18s ease, filter 0.18s ease, opacity 0.18s ease;
    }

    .gate-btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
    .gate-btn:active { transform: translateY(0); }
    .gate-btn:disabled { opacity: 0.55; cursor: default; transform: none; filter: none; }

    .gate-error {
        margin-top: 12px;
        font-size: 0.78rem;
        line-height: 1.5;
        color: #f0908f;
        min-height: 1.2em;
        opacity: 0;
        transition: opacity 0.2s ease;
    }

    .gate-error.show { opacity: 1; }

    .gate-foot {
        margin-top: 16px;
        font-size: 0.7rem;
        color: #6d7889;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .gate-foot a { color: #8d99a9; text-decoration: none; }
    .gate-foot a:hover { color: #cfd7e2; }

    .shake { animation: shake 0.42s cubic-bezier(.36,.07,.19,.97) both; }

    /* ================= 聊天主体 ================= */
    .app {
        width: min(880px, 100%);
        height: calc(var(--app-vh) - 36px);
        max-height: 940px;
        display: grid;
        grid-template-rows: auto 1fr auto;
        border-radius: 26px;
        overflow: hidden;
        background: rgba(14, 17, 23, 0.68);
        border: 1px solid rgba(255, 255, 255, 0.11);
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), 0 1px 0 rgba(255, 255, 255, 0.05) inset;
        backdrop-filter: blur(22px) saturate(120%);
        -webkit-backdrop-filter: blur(22px) saturate(120%);
        animation: fadeUp 0.55s ease both;
    }

    .app[hidden] { display: none; }

    .app-head {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 13px 16px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0));
    }

    .avatar {
        position: relative;
        flex: 0 0 auto;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.05rem;
        font-weight: 600;
        color: #fff;
        background: linear-gradient(140deg, #ff9ec4 0%, #b98cff 55%, #6f8dff 100%);
        box-shadow: 0 6px 18px rgba(180, 120, 255, 0.3);
    }

    .avatar::after {
        content: '';
        position: absolute;
        right: 0;
        bottom: 0;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #64d59a;
        border: 2px solid #12151b;
        box-shadow: 0 0 8px rgba(100, 213, 154, 0.8);
    }

    .head-meta { min-width: 0; }

    .head-name {
        font-size: 0.98rem;
        font-weight: 600;
        letter-spacing: 0.04em;
        color: #f2f5f8;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .head-sub {
        font-size: 0.7rem;
        color: #8d99a9;
        margin-top: 3px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .hearts {
        font-size: 0.68rem;
        letter-spacing: 0.1em;
        color: #ff9ec4;
        opacity: 0.9;
    }

    .head-actions {
        margin-left: auto;
        display: flex;
        gap: 7px;
        align-items: center;
    }

    .icon-btn {
        width: 32px;
        height: 32px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 11px;
        border: 1px solid rgba(255, 255, 255, 0.11);
        background: rgba(255, 255, 255, 0.05);
        color: #c7d0dc;
        cursor: pointer;
        font-size: 0.82rem;
        font-family: inherit;
        transition: background 0.18s ease, color 0.18s ease, border-color 0.18s ease;
        text-decoration: none;
    }

    .icon-btn:hover {
        background: rgba(255, 255, 255, 0.12);
        color: #fff;
        border-color: rgba(255, 255, 255, 0.24);
    }

    /* 消息区 */
    .msgs {
        overflow-y: auto;
        overscroll-behavior: contain;
        padding: 20px 16px 6px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        scrollbar-width: thin;
        scrollbar-color: rgba(255, 255, 255, 0.16) transparent;
    }

    .msgs::-webkit-scrollbar { width: 7px; }
    .msgs::-webkit-scrollbar-track { background: transparent; }
    .msgs::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.14);
        border-radius: 10px;
    }

    .row {
        display: flex;
        align-items: flex-end;
        gap: 8px;
        max-width: 88%;
        animation: pop 0.3s ease both;
    }

    .row.f { align-self: flex-start; }
    .row.u { align-self: flex-end; flex-direction: row-reverse; }

    .row .mini {
        flex: 0 0 auto;
        width: 26px;
        height: 26px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.68rem;
        font-weight: 600;
        color: #fff;
        background: linear-gradient(140deg, #ff9ec4, #b98cff);
        opacity: 0.9;
        margin-bottom: 2px;
    }

    .bubble {
        padding: 9px 14px;
        border-radius: 17px;
        font-size: 0.9rem;
        line-height: 1.75;
        white-space: pre-wrap;
        word-break: break-word;
        overflow-wrap: anywhere;
    }

    .row.f .bubble {
        color: #eaf0f7;
        background: rgba(255, 255, 255, 0.09);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-bottom-left-radius: 6px;
    }

    .row.u .bubble {
        color: #fff;
        background: linear-gradient(135deg, #4a7fd4 0%, #3563b0 100%);
        border-bottom-right-radius: 6px;
        box-shadow: 0 6px 18px rgba(53, 99, 176, 0.28);
    }

    .row .bubble.mono { color: #c3ccd8; font-size: 0.86rem; }

    .typing { display: inline-flex; gap: 4px; align-items: center; padding: 3px 2px; }

    .typing i {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #b9c2cd;
        opacity: 0.35;
        animation: blink 1.25s infinite ease-in-out;
    }

    .typing i:nth-child(2) { animation-delay: 0.18s; }
    .typing i:nth-child(3) { animation-delay: 0.36s; }

    .day-sep {
        align-self: center;
        font-size: 0.68rem;
        color: #6d7889;
        letter-spacing: 0.06em;
        padding: 4px 12px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.06);
        margin: 6px 0;
    }

    /* 输入区 */
    .composer {
        display: flex;
        align-items: flex-end;
        gap: 9px;
        padding: 12px 14px 14px;
        padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px));
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        background: linear-gradient(0deg, rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0));
    }

    .composer textarea {
        flex: 1;
        min-height: 44px;
        max-height: 128px;
        resize: none;
        padding: 11px 14px;
        border-radius: 16px;
        font-family: inherit;
        font-size: 0.9rem;
        line-height: 1.55;
        color: #eef2f7;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.12);
        outline: none;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .composer textarea::placeholder { color: #6f7b8b; }

    .composer textarea:focus {
        border-color: rgba(185, 140, 255, 0.5);
        box-shadow: 0 0 0 3px rgba(185, 140, 255, 0.1);
    }

    .send {
        flex: 0 0 auto;
        width: 44px;
        height: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: none;
        border-radius: 15px;
        cursor: pointer;
        color: #fff;
        background: linear-gradient(135deg, #b98cff 0%, #6f8dff 100%);
        box-shadow: 0 8px 20px rgba(120, 110, 255, 0.3);
        transition: transform 0.16s ease, filter 0.16s ease, opacity 0.16s ease;
    }

    .send:hover { filter: brightness(1.09); }
    .send:active { transform: scale(0.94); }
    .send:disabled { opacity: 0.4; cursor: default; filter: none; }

    .send svg { width: 19px; height: 19px; }

    /* 名字层 */
    .sheet {
        position: fixed;
        inset: 0;
        z-index: 40;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: rgba(8, 10, 14, 0.62);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        animation: fadeIn 0.25s ease both;
    }

    .sheet[hidden] { display: none; }

    .sheet-card {
        width: 100%;
        max-width: 360px;
        padding: 26px 24px 22px;
        border-radius: 22px;
        background: rgba(20, 23, 30, 0.96);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 26px 60px rgba(0, 0, 0, 0.6);
        animation: fadeUp 0.32s ease both;
    }

    .sheet-card h2 {
        font-size: 1rem;
        font-weight: 600;
        margin-bottom: 8px;
    }

    .sheet-card p {
        font-size: 0.78rem;
        color: #8d99a9;
        line-height: 1.6;
        margin-bottom: 16px;
    }

    .toast {
        position: fixed;
        left: 50%;
        bottom: 34px;
        transform: translate(-50%, 12px);
        padding: 9px 18px;
        border-radius: 20px;
        font-size: 0.78rem;
        color: #eef2f7;
        background: rgba(30, 34, 42, 0.94);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s ease, transform 0.25s ease;
        z-index: 90;
        white-space: nowrap;
    }

    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @keyframes fadeUp {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }
    @keyframes pop {
        from { opacity: 0; transform: translateY(6px) scale(0.985); }
        to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes blink {
        0%, 60%, 100% { opacity: 0.25; transform: translateY(0); }
        30% { opacity: 0.95; transform: translateY(-2px); }
    }
    @keyframes shake {
        10%, 90% { transform: translateX(-1px); }
        20%, 80% { transform: translateX(2px); }
        30%, 50%, 70% { transform: translateX(-4px); }
        40%, 60% { transform: translateX(4px); }
    }

    @media (max-width: 640px) {
        body { padding: 0; }
        .app {
            width: 100%;
            height: var(--app-vh);
            max-height: none;
            border-radius: 0;
            border-left: none;
            border-right: none;
        }
        .gate { padding: 26px 20px 22px; margin: 0 16px; width: calc(100% - 32px); }
        .row { max-width: 92%; }
        .head-sub { max-width: 42vw; }
    }

    @media (prefers-reduced-motion: reduce) {
        * { animation-duration: 0.001s !important; transition-duration: 0.001s !important; }
    }
</style>
</head>
<body>
<div class="bg-still" aria-hidden="true"></div>
<div class="bg-overlay" aria-hidden="true"></div>

<!-- 口令 -->
<section class="gate" id="gate" hidden>
    <div class="gate-avatar">F</div>
    <h1>这扇门锁着</h1>
    <p class="hint">里面住着一个人。她不太喜欢陌生人。</p>
    <form id="gate-form" autocomplete="off">
        <input class="field" id="gate-input" type="password" inputmode="text"
               placeholder="口令" autocomplete="off" spellcheck="false" maxlength="64">
        <button class="gate-btn" id="gate-btn" type="submit">开门</button>
    </form>
    <div class="gate-error" id="gate-error"></div>
    <div class="gate-foot">
        <a href="./index.html">← 回去</a>
        <span id="gate-count"></span>
    </div>
</section>

<!-- 聊天 -->
<main class="app" id="app" hidden>
    <header class="app-head">
        <div class="avatar" aria-hidden="true">F</div>
        <div class="head-meta">
            <div class="head-name">F <span class="hearts" id="hearts">♡♡♡♡♡</span></div>
            <div class="head-sub" id="head-sub">17 岁 · 有点小傲娇</div>
        </div>
        <div class="head-actions">
            <button class="icon-btn" id="btn-name" type="button" title="改名字" aria-label="改名字">名</button>
            <button class="icon-btn" id="btn-clear" type="button" title="清空对话" aria-label="清空对话">清</button>
            <button class="icon-btn" id="btn-lock" type="button" title="锁定" aria-label="锁定">锁</button>
            <a class="icon-btn" href="./index.html" title="回到博客" aria-label="回到博客">←</a>
        </div>
    </header>

    <div class="msgs" id="msgs" role="log" aria-live="polite"></div>

    <div class="composer">
        <textarea id="input" rows="1" placeholder="和 F 说点什么…" maxlength="500"></textarea>
        <button class="send" id="send" type="button" aria-label="发送">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M4 11.5 20 4l-7.2 16-2.1-6.7L4 11.5Z" stroke="currentColor" stroke-width="1.7"
                      stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </button>
    </div>
</main>

<!-- 名字 -->
<div class="sheet" id="sheet" hidden>
    <div class="sheet-card">
        <h2>我该叫你什么？</h2>
        <p>她想记住你的名字。写下来就好，之后还能改。</p>
        <input class="field" id="name-input" type="text" placeholder="你的名字" maxlength="16" autocomplete="off">
        <button class="gate-btn" id="name-ok" type="button">就这样</button>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============ SHA-256（纯 JS，离线可用） ============ */
var sha256 = (function () {
    var K = [
        0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
        0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
        0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
        0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
        0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
        0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
        0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
        0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2
    ];
    function rotr(x, n) { return (x >>> n) | (x << (32 - n)); }

    return function (msg) {
        var bytes = [], i, c;
        for (i = 0; i < msg.length; i++) {
            c = msg.charCodeAt(i);
            if (c < 0x80) {
                bytes.push(c);
            } else if (c < 0x800) {
                bytes.push(0xc0 | (c >> 6), 0x80 | (c & 63));
            } else if (c < 0xd800 || c >= 0xe000) {
                bytes.push(0xe0 | (c >> 12), 0x80 | ((c >> 6) & 63), 0x80 | (c & 63));
            } else {
                i++;
                var cp = 0x10000 + (((c & 0x3ff) << 10) | (msg.charCodeAt(i) & 0x3ff));
                bytes.push(0xf0 | (cp >> 18), 0x80 | ((cp >> 12) & 63), 0x80 | ((cp >> 6) & 63), 0x80 | (cp & 63));
            }
        }
        var bits = bytes.length * 8;
        bytes.push(0x80);
        while (bytes.length % 64 !== 56) bytes.push(0);
        var hi = Math.floor(bits / 0x100000000), lo = bits >>> 0;

    var h = sha256(SALT + ':' + pw);
    for (var i = 0; i < ROUNDS; i++) h = sha256(h);
    return h;
}

function tokenOf() {
    return sha256(DIGEST + '|' + (navigator.userAgent || ''));

    /* 重复 */
    if (t && t === lastNorm) {
        out.lines = [rand(D.same)];
        out.intent = 'same';
        return out;
    }

    /* 意图 */
    for (var i = 0; i < INTENTS.length; i++) {
        var it = INTENTS[i];
        if (it.neg && it.neg.test(t)) continue;
        if (it.re.test(t)) {
            var warm = state.aff >= 55;
            out.intent = it.id;
            out.delta = it.delta;
            out.lines = [pickLine(it.id, warm, state.name)];
            /* 偶尔补一句，像真的在打字 */
            if (Math.random() < 0.22 && it.id !== 'bye' && it.id !== 'insult') {
                out.lines.push(rand(['……', '嗯。', '……你别笑我。', '（低头）']));
            }
            lastIntent = it.id;
            return out;
        }
    }

    /* 问句兜底 */
    if (/[？?]/.test(raw)) {
        out.intent = 'question';
        out.delta = 0.5;
        out.lines = [rand(D.question)];
        return out;
    }

    /* 普通兜底 */
    var e = (raw || '').trim().replace(/[。！？!?…]+$/, '');
    if (e.length > 14) e = e.slice(0, 14) + '…';
    out.lines = [rand(D.fallback).replace(/\{e\}/g, e)];
    out.delta = 0.6;
    return out;
}

/* ============ DOM ============ */
var msgs = $('msgs');
var input = $('input');
var sendBtn = $('send');
var queue = [];
var busy = false;
var typingRow = null;
var idleTimer = null;
var idleCount = 0;

function bubbleRow(role, text) {
    var row = document.createElement('div');
    row.className = 'row ' + role;

    if (role === 'f') {
        var mini = document.createElement('div');
        mini.className = 'mini';
        mini.textContent = 'F';
        row.appendChild(mini);
    }

    var b = document.createElement('div');
    b.className = 'bubble';
    b.textContent = text;
    row.appendChild(b);

    msgs.appendChild(row);
    msgs.scrollTop = msgs.scrollHeight;
    return row;
}

function showTyping(on) {
    if (on) {
        if (typingRow) return;
        typingRow = document.createElement('div');
        typingRow.className = 'row f';
        var mini = document.createElement('div');
        mini.className = 'mini';
        mini.textContent = 'F';
        var b = document.createElement('div');
        b.className = 'bubble';
        b.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
        typingRow.appendChild(mini);
        typingRow.appendChild(b);
        msgs.appendChild(typingRow);
        msgs.scrollTop = msgs.scrollHeight;
    } else if (typingRow) {
        typingRow.remove();
        typingRow = null;
    }
}

function pushF(text, silent) {
    state.hist.push({ r: 'f', t: text, ts: Date.now() });
    bubbleRow('f', text);
    state.last = Date.now();
    if (!silent) saveState();
}

function enqueue(lines) {
    for (var i = 0; i < lines.length; i++) if (lines[i]) queue.push(lines[i]);
    pump();
}

function pump() {
    if (busy || !queue.length) return;
    busy = true;
    var text = queue.shift();
    var delay = Math.min(2300, 430 + text.length * 32);

    setTimeout(function () {
        showTyping(true);
        setTimeout(function () {
            showTyping(false);
            pushF(text);
            busy = false;
            if (queue.length) {
                setTimeout(pump, 200 + Math.random() * 260);
            }
            saveState();
        }, Math.min(1200, 220 + text.length * 12));
    }, Math.min(420, delay * 0.35));
}

function apiMessages() {
    var out = [];
    state.hist.slice(-16).forEach(function (m) {
        var role = m.r === 'u' ? 'user' : 'assistant';
        var content = (m.t || '').trim();
        if (!content) return;
        if (out.length && out[out.length - 1].role === role) {
            out[out.length - 1].content += '\n' + content;
        } else {
            out.push({ role: role, content: content });
        }
    });
    return out;
}

function askApi() {
    if (!API_URL) return Promise.resolve('');

    var ctrl = null, timer = null;
    try { ctrl = new AbortController(); } catch (e) {}

    if (ctrl) timer = setTimeout(function () { ctrl.abort(); }, 18000);

    var opts = {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            messages: apiMessages(),
            name: state.name,
            affection: Math.round(state.aff)
        })
    };
    if (ctrl) opts.signal = ctrl.signal;

    return fetch(API_URL, opts)
        .then(function (r) {
            if (!r.ok) throw new Error('http ' + r.status);
            return r.json();
        })
        .then(function (d) {
            if (timer) clearTimeout(timer);
            return (d && typeof d.reply === 'string') ? d.reply.trim() : '';
        })
        .catch(function () {
            if (timer) clearTimeout(timer);
            return '';
        });
}

function sendUser(text) {
    var raw = (text || '').trim();
    if (!raw) return;

    state.hist.push({ r: 'u', t: raw, ts: Date.now() });
    bubbleRow('u', raw);
    input.value = '';
    autoGrow();
    saveState();

    var res = reply(raw);
    state.aff = clamp(state.aff + (res.delta || 0), 0, 100);
    renderAff();
    resetIdle();

    if (!API_URL) {
        enqueue(res.lines);
        checkMilestone();
        return;
    }

    /* 有接口：先亮起「正在输入」，再换成真正生成的话 */
    var started = Date.now();
    busy = true;
    showTyping(true);

    askApi().then(function (txt) {
        var wait = Math.max(0, 680 - (Date.now() - started));
        setTimeout(function () {
            showTyping(false);
            busy = false;
            if (txt) enqueue([txt]);
            else enqueue(res.lines);
            checkMilestone();
        }, wait);
    });
}

function checkMilestone() {
    var marks = [30, 50, 70, 85];
    for (var i = 0; i < marks.length; i++) {
        var m = marks[i];
        if (state.aff >= m && state.ms.indexOf(m) === -1) {
            state.ms.push(m);
            var line = D.milestone[m];
            if (line) setTimeout(function () { enqueue([line]); }, 2500);
            break;
        }
    }
}

function renderAff() {
    var hearts = Math.round(state.aff / 20);
    var s = '';
    for (var i = 0; i < 5; i++) s += i < hearts ? '♥' : '♡';
    $('hearts').textContent = s;

    var label;
    if (state.aff < 20) label = '还很生疏';
    else if (state.aff < 40) label = '稍微熟了';
    else if (state.aff < 60) label = '有点在意你';
    else if (state.aff < 80) label = '口是心非';
    else label = '只对你这样';

    $('head-sub').textContent = '17 岁 · ' + label;
}

function autoGrow() {
    input.style.height = 'auto';
    input.style.height = Math.min(128, input.scrollHeight) + 'px';
}

/* 空闲搭话 */
function resetIdle() {
    clearTimeout(idleTimer);
    if (idleCount >= 2) return;
    idleTimer = setTimeout(function () {
        if (document.hidden) return;
        if (state.aff < 18) return;
        idleCount++;
        var line = idleCount === 1 ? D.nudge[0] : (state.aff >= 55 ? D.nudge[2] : D.nudge[1]);
        enqueue([line]);
    }, 100000);
}

/* ============ 首次 / 回归开场 ============ */
function opening() {
    var h = new Date().getHours();
    var lines = [];
    var gap = state.last ? (Date.now() - state.last) : 0;
    var days = gap / 86400000;

    if (state.hist.length && gap < 300000) return;

    if (!state.hist.length) {
        if (h >= 23 || h < 5) lines.push('……这么晚。');
        else if (h < 11) lines.push('……早。');
        else if (h < 18) lines.push('……嗯，你来了。');
        else lines.push('……晚上好。');
        lines.push('我不太会跟人聊天。你随便说点什么吧。');
        if (!state.name) {
            setTimeout(function () { openSheet(true); }, 1600);
        }
    } else {
        if (days >= 3) lines.push('……好久不见。我还以为你忘了这里。');
        else if (days >= 1) lines.push('……又来了。');
        else lines.push('……嗯，我在。');
        if (state.name) lines.push(fill('{n}。', state.name));
    }

    enqueue(lines);
    state.met = state.met || Date.now();
    saveState();
}

/* 历史回放 */
function replay() {
    if (!state.hist.length) return;
    var lastDay = '';
    state.hist.forEach(function (m) {
        var d = new Date(m.ts);
        var key = d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate();
        if (key !== lastDay) {
            lastDay = key;
            var sep = document.createElement('div');
            sep.className = 'day-sep';
            sep.textContent = (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日';
            msgs.appendChild(sep);
        }
        bubbleRow(m.r === 'u' ? 'u' : 'f', m.t);
    });
    msgs.scrollTop = msgs.scrollHeight;
}

/* ============ 名字面板 ============ */
var sheet = $('sheet');
var nameInput = $('name-input');

function openSheet(first) {
    sheet.hidden = false;
    nameInput.value = state.name || '';
    setTimeout(function () { nameInput.focus(); }, 60);
    sheet._first = !!first;
}

function closeSheet() {
    sheet.hidden = true;
}

$('name-ok').addEventListener('click', function () {
    var v = nameInput.value.trim().slice(0, 16);
    if (!v) { nameInput.focus(); return; }
    var old = state.name;
    state.name = v;
    closeSheet();
    if (old === v) return;
    var lines = [fill(rand(old ? D.nameChange : D.nameSet), v)];
    if (!old) lines.push('……以后我就这么叫你了。');
    enqueue(lines);
    saveState();
});

nameInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); $('name-ok').click(); }
});

/* ============ 口令 ============ */
var gate = $('gate');
var gateInput = $('gate-input');
var gateErr = $('gate-error');
var gateBtn = $('gate-btn');
var failCount = 0;
var lockUntil = 0;

function unlocked() {
    try {
        var raw = localStorage.getItem(K_GATE);
        if (!raw) return false;
        var g = JSON.parse(raw);
        return g && g.t === tokenOf() && g.e > Date.now();
    } catch (e) { return false; }
}

function setUnlocked() {
    try {
        localStorage.setItem(K_GATE, JSON.stringify({
            t: tokenOf(),
            e: Date.now() + GATE_DAYS * 86400000
        }));
    } catch (e) {}
}

function showApp() {
    gate.hidden = true;
    $('app').hidden = false;
    replay();
    opening();
    renderAff();
    setTimeout(function () { input.focus(); }, 400);
}

function gateError(msg) {
    gateErr.textContent = msg;
    gateErr.classList.add('show');
    gate.classList.remove('shake');
    void gate.offsetWidth;
    gate.classList.add('shake');
}

function tryUnlock(pw) {
    if (lockUntil > Date.now()) return;
    gateBtn.disabled = true;
    gateBtn.textContent = '校验中…';
    setTimeout(function () {
        var ok = false;
        try { ok = stretch(pw) === DIGEST; } catch (e) { ok = false; }
        gateBtn.disabled = false;
        gateBtn.textContent = '开门';
        if (ok) {
            setUnlocked();
            failCount = 0;
            gateErr.classList.remove('show');
            showApp();
        } else {
            failCount++;
            var left = 5 - failCount;
            if (failCount >= 5) {
                lockUntil = Date.now() + 30000;
                failCount = 0;
                gateError('试了太多次。等三十秒吧。');
                countdown();
            } else {
                gateError('不对。还剩 ' + left + ' 次。');
            }
            gateInput.value = '';
            gateInput.focus();
        }
    }, 30);
}

function countdown() {
    var el = $('gate-count');
    var tick = function () {
        var left = Math.ceil((lockUntil - Date.now()) / 1000);
        if (left > 0) {
            el.textContent = left + ' 秒后可再试';
            gateBtn.disabled = true;
            setTimeout(tick, 250);
        } else {
            el.textContent = '';
            gateBtn.disabled = false;
        }
    };
    tick();
}

$('gate-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var pw = gateInput.value;
    if (!pw) { gateInput.focus(); return; }
    tryUnlock(pw);
});

/* ============ 事件 ============ */
sendBtn.addEventListener('click', function () {
    sendUser(input.value);
    input.focus();
});

input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
        e.preventDefault();
        sendUser(input.value);
    }
});

input.addEventListener('input', autoGrow);

$('btn-name').addEventListener('click', function () { openSheet(false); });

$('btn-clear').addEventListener('click', function () {
    if (!confirm('把这段对话全部删掉？她也会忘记。')) return;
    state.hist = [];
    state.aff = 12;
    state.ms = [];
    lastNorm = '';
    queue = [];
    msgs.innerHTML = '';
    saveState();
    renderAff();
    enqueue(['……我们重新开始吧。']);
});

$('btn-lock').addEventListener('click', function () {
    try { localStorage.removeItem(K_GATE); } catch (e) {}
    location.reload();
});

document.addEventListener('visibilitychange', function () {
    if (document.hidden) clearTimeout(idleTimer);
    else resetIdle();
});

/* ============ 启动 ============ */
(function boot() {
    var s = loadState();
    if (s) {
        state.name = s.name || '';
        state.aff = typeof s.aff === 'number' ? s.aff : 12;
        state.hist = Array.isArray(s.hist) ? s.hist : [];
        state.last = s.last || 0;
        state.met = s.met || 0;
        state.ms = Array.isArray(s.ms) ? s.ms : [];
    }

    if (unlocked()) {
        showApp();
    } else {
        gate.hidden = false;
        setTimeout(function () { gateInput.focus(); }, 200);
    }
})();
</script>
